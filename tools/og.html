<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../site/assets/fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:IS;src:url(../site/assets/fonts/instrument-serif-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:IS;font-style:italic;src:url(../site/assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:JB;src:url(../site/assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f7f6f2;color:#141413;font-family:Inter;position:relative;overflow:hidden}
body:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#e2e0d8 1.4px,transparent 1.4px);background-size:26px 26px;opacity:.9}
.wrap{position:absolute;inset:64px 72px;display:grid;grid-template-columns:1.25fr .75fr;gap:48px;align-items:center}
.eb{font:600 20px JB;letter-spacing:.08em;text-transform:uppercase;color:#64635e;display:flex;gap:14px;align-items:center;margin-bottom:26px}
.eb:before{content:"";width:34px;height:2px;background:#64635e}
h1{font:400 112px/0.95 IS;letter-spacing:-.02em;margin-bottom:28px}
h1 em{color:#4a4945}
p{font-size:26px;line-height:1.4;color:#4a4945;max-width:22em}
p b{color:#141413;font-weight:600}
.card{background:#fdfdfb;border:1.5px solid #e2e0d8;border-radius:22px;padding:26px 26px 20px;box-shadow:0 18px 40px -22px rgba(0,0,0,.25)}
.card .t{font:600 16px JB;color:#64635e;margin-bottom:14px}
.cols{display:flex;align-items:flex-end;gap:12px;height:210px;border-bottom:2px solid #cfccc1}
.cols i{flex:1;background:#2a78d6;border-radius:6px 6px 0 0;display:block}
.x{display:flex;gap:12px;margin-top:8px}.x span{flex:1;text-align:center;font:500 14px Inter;color:#64635e}
.k{display:flex;justify-content:space-between;margin-top:16px;font:600 18px Inter}.k span{color:#64635e;font-weight:500;font-size:15px}
.url{position:absolute;left:72px;bottom:40px;font:600 20px JB;color:#2554c7}
.tag{position:absolute;right:72px;bottom:40px;font:500 18px Inter;color:#64635e}
</style></head><body><div class="wrap"><div>
<div class="eb">__EYEBROW__</div><h1>Daniel Galea <em>Romero</em></h1><p>__LEAD__</p></div>
<div class="card"><div class="t">__CARDT__</div><div class="cols">__BARS__</div><div class="x">__X__</div><div class="k">__K1__<span>__K2__</span></div></div></div>
<div class="url">__URL__</div><div class="tag">__TAG__</div></body></html>
